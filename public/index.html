<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Platform Pulse - Live Tracker</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            --bg-primary: #313338;
            --bg-secondary: #2b2d31;
            --bg-embed: #1e1f22;
            --text-normal: #dbdee1;
            --text-muted: #949ba4;
            --text-link: #00a8fc;
            --status-green: #23a55a;
            --status-blue: #5865f2;
            --status-red: #f23f43;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-normal);
            margin: 0;
            padding: 20px;
        }

        .dashboard-layout {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .column {
            flex: 1;
            background-color: var(--bg-secondary);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .header {
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background-color: var(--bg-secondary);
            z-index: 10;
        }

        .header h1 { margin: 0; font-size: 1.1rem; }

        .live-indicator {
            font-size: 0.75rem;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: bold;
        }
        .bg-blue { background-color: var(--status-blue); }
        .bg-red { background-color: var(--status-red); }

        .embed-card {
            background-color: var(--bg-embed);
            border-radius: 4px;
            border-left: 4px solid transparent;
            padding: 12px 16px;
            margin-bottom: 12px;
            animation: slideIn 0.25s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateY(-8px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .embed-card.creation { border-left-color: var(--status-blue); }
        .embed-card.deleted { border-left-color: var(--status-red); }

        .status-title { font-weight: bold; font-size: 0.9rem; margin-bottom: 6px; color: #fff;}
        .description { font-size: 0.85rem; margin-bottom: 6px; line-height: 1.4; }
        .game-link { color: var(--text-link); text-decoration: none; font-weight: 600; }
        .game-link:hover { text-decoration: underline; }

        .field { font-size: 0.8rem; margin-bottom: 4px; }
        .field-label { font-weight: bold; color: var(--text-muted); }
        .field-value { font-family: monospace; background: rgba(0,0,0,0.2); padding: 1px 4px; border-radius: 3px; }
        .embed-footer { font-size: 0.7rem; color: var(--text-muted); margin-top: 6px; }

        .placeholder { text-align: center; color: var(--text-muted); padding: 40px 0; font-style: italic; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="dashboard-layout">
    
    <div class="column">
        <div class="header">
            <h1>🚀 Live Creations (Per Second)</h1>
            <div class="live-indicator bg-blue">STREAMING WORLDWIDE</div>
        </div>
        <div id="creation-feed">
            <div class="placeholder" id="empty-creations">Listening for brand new Place IDs...</div>
        </div>
    </div>

    <div class="column">
        <div class="header">
            <h1>🚫 Live Deletions / Bans</h1>
            <div class="live-indicator bg-red">MONITORING MODERATION</div>
        </div>
        <div id="ban-feed">
            <div class="placeholder" id="empty-bans">Watching for moderation disruptions...</div>
        </div>
    </div>

</div>

<script>
    const socket = io();
    const creationFeed = document.getElementById('creation-feed');
    const banFeed = document.getElementById('ban-feed');
    const emptyCreations = document.getElementById('empty-creations');
    const emptyBans = document.getElementById('empty-bans');

    // Handle incoming Second-by-Second creations
    socket.on('new-game-created', (data) => {
        if (emptyCreations) emptyCreations.remove();

        const card = document.createElement('div');
        card.className = 'embed-card creation';
        card.innerHTML = `
            <div class="status-title">🆕 New Experience Registered</div>
            <div class="description">
                🎮 <a href="https://www.roblox.com/games/${data.placeId}" target="_blank" class="game-link">${data.name}</a> was just initialized.
            </div>
            <div class="field"><span class="field-label">Creator:</span> <span class="text-normal">${data.builder}</span></div>
            <div class="field"><span class="field-label">Place ID:</span> <span class="field-value">${data.placeId}</span></div>
            <div class="embed-footer">Creation Ticker • ${data.time}</div>
        `;
        creationFeed.insertBefore(card, creationFeed.firstChild);
    });

    // Handle incoming deletions
    socket.on('status-update', (data) => {
        if (emptyBans) emptyBans.remove();

        const card = document.createElement('div');
        card.className = 'embed-card deleted';
        card.innerHTML = `
            <div class="status-title">🚫 Game Restricted / Content Deleted</div>
            <div class="description">
                ✒️ <a href="https://www.roblox.com/games/${data.placeId}" target="_blank" class="game-link">${data.name}</a> has been flagged by moderation.
            </div>
            <div class="field"><span class="field-label">Place ID:</span> <span class="field-value">${data.placeId}</span></div>
            <div class="embed-footer">Deletion Monitor • ${data.time}</div>
        `;
        banFeed.insertBefore(card, banFeed.firstChild);
    });
</script>
</body>
</html>
